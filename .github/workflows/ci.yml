name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
  pull_request:
    branches:
      - main
      - master
      - develop
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Build, Test & Validate Tech Stack (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package.json
            package-lock.json

      - name: Cache npm packages & build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules/.vite
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install dependencies cleanly
        run: |
          echo "📦 Installing clean dependencies via npm ci..."
          npm ci --legacy-peer-deps


      - name: Validate project structure & config integrity
        run: |
          echo "🔍 Validating project architecture & critical configurations..."
          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "tsconfig.json"
            "vite.config.ts"
            "index.html"
            "src/main.tsx"
            "src/App.tsx"
            "supabase_rls_policies.sql"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Error: Mandatory file '$file' is missing from repository."
              exit 1
            fi
            echo "  ✓ Verified: $file"
          done
          
          if [ -f ".env" ]; then
            echo "⚠️ Warning: Found tracked .env file in repository. Ensuring environment secrets remain safe."
          fi
          
          echo "✅ Project structure & configuration validation passed."

      - name: Run strict TypeScript type checking
        run: |
          echo "🔍 Running strict TypeScript static type checks across all modules..."
          npm run type-check

      - name: Run Vitest unit & pipeline validation suite
        run: |
          echo "🧪 Running automated Vitest test suite for data pipelines & models..."
          npm test

      - name: Build production application bundle
        run: |
          echo "⚡ Compiling production bundle with Vite (React 19, Motion, Recharts, OGL)..."
          npm run build
        env:
          NODE_ENV: production

      - name: Validate build output artifacts
        run: |
          echo "🔍 Inspecting production build artifacts in dist/..."
          if [ ! -d "dist" ]; then
            echo "❌ Error: 'dist' output directory was not generated."
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Error: 'dist/index.html' is missing from build output."
            exit 1
          fi
          if [ ! -s "dist/index.html" ]; then
            echo "❌ Error: 'dist/index.html' is empty."
            exit 1
          fi
          echo "Build Statistics:"
          ls -lah dist/
          ls -lah dist/assets/
          echo "✅ Production build artifact validation passed."

      - name: Dependency security audit
        run: |
          echo "🛡️ Running security audit check for high/critical vulnerabilities..."
          npm audit --audit-level=high || echo "⚠️ Security audit advisory completed with non-blocking warnings."

      - name: Upload production build artifact
        if: matrix.node-version == '22.x' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: production-build-dist
          path: dist/
          retention-days: 7
